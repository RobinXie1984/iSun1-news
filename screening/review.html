<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iSun Radar — source screening review</title>
<style>
:root{--ink:#172d29;--muted:#62756f;--line:#d9e2dc;--paper:#f4f6f1;--green:#176650;--orange:#df6b38;--soft:#e6eee5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"PingFang SC",sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-color:var(--green)}button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px;border-radius:7px}button:hover{border-color:var(--green)}a{color:var(--green)}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}aside{border-right:1px solid var(--line);padding:30px 22px;background:#eef2eb;position:sticky;top:0;height:100vh}.brand{font-size:34px;letter-spacing:-2px;font-weight:780}.brand b{color:var(--orange)}.brand small{display:block;font-size:11px;letter-spacing:3px;margin-top:3px;color:var(--muted)}.review-only{font-size:12px;color:var(--muted);margin:24px 0}.nav{display:grid;gap:6px}.nav button{text-align:left;background:transparent;border:0}.nav button.active{background:var(--green);color:white}.side-bottom{position:absolute;bottom:24px;font-size:12px;color:var(--muted);max-width:170px}main{max-width:1500px;width:100%;padding:28px 42px 60px}header{display:flex;justify-content:space-between;gap:25px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:21px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.6px;color:var(--green);text-transform:uppercase}h1{font-size:34px;line-height:1.15;letter-spacing:-1px;margin:9px 0}h2{font-size:23px;line-height:1.3;letter-spacing:-.35px;margin:0 0 10px}h3{margin:0 0 12px;font-size:17px}p{margin:8px 0}.muted{color:var(--muted)}.top-actions{display:flex;gap:7px;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:25px 0 14px}.stat{padding:17px 18px;background:white;border:1px solid var(--line);border-radius:9px}.stat strong{font-size:29px;font-weight:650;display:block;letter-spacing:-1px}.stat span{font-size:12px;color:var(--muted)}.notice{font-size:12px;border-left:3px solid var(--orange);padding:7px 12px;margin-bottom:26px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:15px 0 22px}.toolbar input{flex:1;min-width:180px}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:7px;background:#fff;padding:10px 12px}.section-heading{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-top:25px}.small{font-size:12px}.card{display:grid;grid-template-columns:78px 1fr;background:white;border:1px solid var(--line);border-radius:10px;padding:23px;margin:12px 0;gap:22px}.score{border-right:1px solid var(--line);padding-right:17px}.score strong{display:block;font-size:33px;line-height:1.1;font-weight:650;letter-spacing:-1px}.score span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}.spark{margin-top:20px;color:var(--orange);font-size:13px}.meta{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:9px;font-size:11px;color:var(--muted)}.pill{padding:3px 7px;border-radius:4px;background:var(--soft);color:var(--green)}.pill.warn{background:#fff0e6;color:#8c4d19}.reason{max-width:850px}.evidence-line{font-size:12px;color:var(--muted);margin:13px 0}.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}.actions button{font-size:12px;padding:7px 10px}.actions button.selected{background:var(--green);color:white}.actions .notes-toggle{margin-left:auto}details{border-top:1px solid var(--line);padding-top:12px;margin-top:15px}summary{cursor:pointer;font-size:12px;color:var(--green)}.detail-grid{display:grid;grid-template-columns:1fr 1.5fr;gap:28px;margin-top:20px}.factor{display:grid;grid-template-columns:85px 1fr 30px;gap:10px;align-items:center;font-size:12px;margin:8px 0}.bar{height:6px;border-radius:5px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}.source{margin:12px 0;font-size:12px}.source a{display:block;font-size:13px;font-weight:550}.source p{margin:3px 0}.notes{display:flex;gap:8px;margin-top:14px}.notes textarea{width:100%;min-height:64px;padding:9px;border:1px solid var(--line);border-radius:7px}.empty{padding:45px;background:#fff;border:1px dashed var(--line);text-align:center;border-radius:10px}.source-table{width:100%;border-collapse:collapse;background:white;font-size:13px}.source-table th,.source-table td{text-align:left;border-bottom:1px solid var(--line);padding:14px;vertical-align:top}.method{max-width:900px;background:white;border:1px solid var(--line);border-radius:10px;padding:25px;margin-top:20px}.method li{margin:10px 0}.method-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.method-grid div{border:1px solid var(--line);padding:15px;border-radius:7px}.method-grid strong{display:block}.toast{position:fixed;bottom:25px;right:30px;background:var(--ink);color:white;padding:12px 18px;border-radius:8px;max-width:500px;z-index:10}.hidden{display:none!important}.footnote{font-size:12px;color:var(--muted);margin-top:20px}.loadmore{margin:20px auto;display:block}
@media(max-width:1000px){.shell{grid-template-columns:170px 1fr}aside{padding:25px 15px}main{padding:25px}.stats{grid-template-columns:repeat(3,1fr)}h1{font-size:29px}.detail-grid{grid-template-columns:1fr}}
@media(max-width:650px){.shell{display:block}aside{position:static;height:auto;padding:16px;border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:26px}.brand small,.review-only,.side-bottom{display:none}.nav{display:flex;overflow:auto;margin-top:14px;gap:3px}.nav button{white-space:nowrap;font-size:12px;padding:7px}.top-actions{flex-direction:column}main{padding:18px}.stats{grid-template-columns:repeat(3,1fr);gap:7px}.stat{padding:10px}.stat strong{font-size:23px}.card{grid-template-columns:48px 1fr;gap:12px;padding:15px}.score{padding-right:8px}.score strong{font-size:26px}h2{font-size:19px}.score span{font-size:8px}.method-grid{grid-template-columns:1fr}.source-table{font-size:11px}.source-table th,.source-table td{padding:8px}}
</style></head><body><div class="shell"><aside><div class="brand">iSun<b>1</b><small>WORLD RADAR</small></div><p class="review-only" id="reviewOnly"></p><nav class="nav" id="nav"></nav><div class="side-bottom" id="sideBottom"></div></aside><main><header><div><div class="eyebrow" id="eyebrow"></div><h1 id="heading"></h1><p class="muted" id="deck"></p></div><div class="top-actions"><button id="language" aria-label="Switch language">中文</button><button id="refresh"></button></div></header><section class="stats" id="stats"></section><div class="notice" id="notice"></div><section id="content"><p>Loading the real screening run…</p></section><p class="footnote" id="footnote"></p></main></div><div id="toast" class="toast hidden" role="status"></div>
<script>
let data,tab='shortlist',lang=localStorage.getItem('radar-language')||'en',query='',category='',region='',pageSize=30;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t=(en,zh)=>lang==='zh'?zh:en,n=v=>v==null?'—':Number(v).toLocaleString(),date=v=>v?new Date(v).toLocaleString(lang==='zh'?'zh-CN':'en-GB',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):t('Unknown','未知');
const factorNames={scale:['Reach','影响范围'],impact:['Impact','即时冲击'],novelty:['Novelty','新颖程度'],potential:['Future effect','未来影响'],legacy:['Durability','持久影响']};
const navs={shortlist:['Significant events','重要事件'],finds:['Story finds','故事线索'],audit:['Check the rejects','抽查落选'],pending:['Not yet screened','尚未筛选'],all:['All candidates','全部候选'],sources:['Source coverage','来源覆盖'],method:['How it works','筛选方法']};
const verdicts={take_forward:['Take forward','进入研究'],too_small:['Too small','影响太小'],needs_evidence:['Needs proof','需要证据'],duplicate:['Duplicate','重复事件'],clear:['Clear','撤销']};
function decision(e){const d=data.reviews.decisions[e.id];return d?.revision===e.revision?d:null}
function score(e){return e.assessment?.significance??null}
function sort(a,b){return (score(b)??-1)-(score(a)??-1)||a.id.localeCompare(b.id)}
function notify(message){$('#toast').textContent=message;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),4500)}
async function load(){try{const r=await fetch('/api/screen');if(!r.ok)throw Error('Cannot load screening snapshot');data=await r.json();render()}catch(e){$('#content').textContent=e.message}}
function render(){
 document.documentElement.lang=lang;$('#language').textContent=t('中文','English');$('#refresh').textContent=t('Refresh run','刷新结果');$('#reviewOnly').textContent=t('REVIEW PROTOTYPE · Publishing is disconnected.','审阅原型 · 尚未接入发布');$('#sideBottom').textContent=t('Your judgments become examples for the next screening pass.','你的判断，会成为下一轮筛选的学习样本。');$('#eyebrow').textContent=t('Discover widely. Choose deliberately.','广泛发现，认真取舍。');$('#heading').textContent=t('What deserves a closer look?','哪些事件，值得再看一眼？');$('#deck').textContent=t('Significance first. Story potential beside it. Your call comes next.','先看事件影响，再看故事潜力。最后由你判断。');
 $('#nav').innerHTML=Object.entries(navs).map(([k,v])=>`<button class="${tab===k?'active':''}" data-tab="${k}">${t(...v)}</button>`).join('');
 const c=data.counts,ok=data.source_reports.filter(s=>s.status==='OK').length,active=data.sources.filter(s=>s.enabled!==false).length;
 $('#stats').innerHTML=[[c.feed_entries,t('Feed entries scanned','读到的订阅条目')],[c.unique_urls,t('Unique article links','独立文章链接')],[c.candidate_groups,t('Candidate groups','初步候选组')],[c.scored,t('AI-screened candidates','已完成AI筛选')],[c.unscored,t('Awaiting screening','仍待筛选')]].map(([v,label])=>`<div class="stat"><strong>${n(v)}</strong><span>${label}</span></div>`).join('');
 $('#notice').textContent=t(`${ok}/${active} enabled source feeds returned successfully. ${c.event_proposals} event proposals after grouping. ${c.unknown_totals??0} assessed candidates have unknown totals. Scores are editorial estimates. Unscreened is not rejected.`,`${active}个启用的订阅源中，${ok}个成功返回。分组后有${c.event_proposals}个待核实事件组；${c.unknown_totals??0}条已评估项的总分仍未知。分数是编辑估计，未处理不等于落选。`);
 $('#footnote').textContent=t(`Run began ${date(data.started_at)} · Updated ${date(data.updated_at)} ·7-day publisher window; GDELT rolling15-minute discovery window. This is measured source coverage, not all news on the internet.`,`开始于${date(data.started_at)} · 更新于${date(data.updated_at)} · 媒体源回看7天；GDELT为滚动15分钟发现窗口。这里展示实际覆盖范围，不声称遍历全网。`);
 if(tab==='sources'){renderSources();return}if(tab==='method'){renderMethod();return}renderList();
}
function chosen(){let e=[...data.events];
 if(tab==='pending')e=e.filter(x=>!x.assessment||score(x)==null);
 else if(tab==='shortlist')e=e.filter(x=>score(x)!=null).sort(sort).slice(0,10);
 else if(tab==='finds')e=e.filter(x=>x.assessment?.story_potential>=3).sort((a,b)=>b.assessment.story_potential-a.assessment.story_potential||sort(a,b));
 else if(tab==='audit'){const top=new Set([...e].filter(x=>score(x)!=null).sort(sort).slice(0,10).map(x=>x.id));e=e.filter(x=>x.assessment&&!top.has(x.id)).sort((a,b)=>a.id.localeCompare(b.id)).slice(0,5)}
 else e.sort(sort);
 return e.filter(e=>(!query||[e.title,e.assessment?.title_en,e.assessment?.title_zh,...e.articles.map(a=>a.publisher+' '+a.title)].join(' ').toLowerCase().includes(query.toLowerCase()))&&(!category||e.assessment?.category===category)&&(!region||e.articles.some(a=>a.region===region)));
}
function renderList(){const events=chosen(),cats=[...new Set(data.events.map(e=>e.assessment?.category).filter(Boolean))].sort(),regions=[...new Set(data.events.flatMap(e=>e.articles.map(a=>a.region)))].sort();
 $('#content').innerHTML=`<div class="section-heading"><h2>${t(...navs[tab])}</h2><span class="muted small">${n(events.length)} ${t('in this view','条匹配')}</span></div><div class="toolbar"><input id="search" aria-label="Search candidates" placeholder="${t('Search any event or publisher…','搜索事件、媒体或关键词……')}" value="${esc(query)}"><select id="category" aria-label="Category"><option value="">${t('All topics','全部话题')}</option>${cats.map(c=>`<option ${c===category?'selected':''}>${esc(c)}</option>`).join('')}</select><select id="region" aria-label="Source region"><option value="">${t('All source regions','全部来源地区')}</option>${regions.map(c=>`<option ${c===region?'selected':''}>${esc(c)}</option>`).join('')}</select><a href="/api/export" download="isun-radar-review.json">${t('Export my review','导出我的审阅')}</a></div>${tab==='audit'?`<p class="muted small">${t('Five reproducible samples outside the top ten. Look for important misses; these are not proven bad stories.','从前十名之外固定抽取5条，检查重要遗漏。它们并非已被证明不值得报道。')}</p>`:''}${tab==='pending'?`<p class="muted small">${t('Includes budget backlog, unknown scores, archived-link hints and scorer failures. None is treated as a zero.','包含预算之外的积压、未评分项、旧链接线索和评分失败项，不会被当成零分。')}</p>`:''}<div id="cards">${events.slice(0,pageSize).map(card).join('')||`<div class="empty">${t('No matching candidates in this run.','本轮没有匹配的候选。')}</div>`}</div>${events.length>pageSize?`<button class="loadmore" id="more">${t('Show30 more','再看30条')}</button>`:''}`;
 $('#search').oninput=e=>{query=e.target.value;const pos=e.target.selectionStart;renderList();$('#search').focus();$('#search').setSelectionRange(pos,pos)};$('#category').onchange=e=>{category=e.target.value;renderList()};$('#region').onchange=e=>{region=e.target.value;renderList()};
}
function card(e){const a=e.assessment,d=decision(e),read=e.articles.some(x=>x.article_status==='EXCERPT_READ'),rawSources=[...new Set(e.articles.map(a=>a.publisher))];
 const title=a?(lang==='zh'?a.title_zh:a.title_en):e.title;
 return `<article class="card" data-id="${e.id}"><div class="score"><strong>${score(e)==null?'—':score(e).toFixed(1)}</strong><span>${t('Significance /10','重要性 /10')}</span><div class="spark">${a?`${a.story_potential}/4`:'—'}<br><span>${t('Story potential','故事潜力')}</span></div></div><div><div class="meta"><span class="pill">${esc(a?.category||t('Unscreened','待筛选'))}</span><span class="pill ${read?'':'warn'}">${read?t('Source excerpt read','已读原文片段'):t('Metadata only','仅有标题／摘要')}</span>${a?`<span>${esc(a.direction)}</span>`:''}${d?`<span class="pill">${t(...verdicts[d.verdict])}</span>`:''}</div><h2>${esc(title)}</h2><p class="reason muted">${esc(a?(lang==='zh'?a.why_zh:a.why_en):(e.assessment_error||t('Awaiting AI screening. Open the sources to inspect the lead.','等待AI筛选，可展开来源先看线索。')))}</p><p class="evidence-line">${esc(rawSources.slice(0,3).join(' · '))}${rawSources.length>3?' +'+(rawSources.length-3):''} · ${e.articles.length} ${t('links; independence unverified','个链接；独立性未核验')}</p><details><summary>${t('Why this score? Inspect evidence and dates','为什么这样打分？查看证据与日期')}</summary><div class="detail-grid"><div><h3>${t('Editorial estimate','编辑估计')}</h3>${Object.entries(factorNames).map(([k,v])=>`<div class="factor"><span>${t(...v)}</span><div class="bar"><i style="width:${(a?.scores[k]??0)*25}%"></i></div><span>${a?.scores[k]??'—'}/4</span></div>`).join('')}<p class="small muted">${esc(a?.uncertainty||t('Evidence has not been assessed.','证据尚未评估。'))}</p><p class="small muted">${t('Event date: unknown until verified. Grouping is a proposal, not corroboration.','事件日期：待核实。合组仅为候选判断，不代表交叉证实。')}</p></div><div><h3>${t('Open the reporting','打开原始报道')}</h3>${e.articles.map(s=>`<div class="source"><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ↗</a><p>${esc(s.publisher)} · ${esc(s.language)} · ${esc(s.region)}</p><p>${t('Reported','报道时间')}: ${date(s.published_at)} · ${t('Found','发现时间')}: ${date(s.observed_at)}</p>${s.archive_hint?`<span class="pill warn">${t('Older date in URL — check original date','链接含旧日期，须核对原始日期')}</span>`:''}<p class="muted">${esc(s.excerpt)}</p></div>`).join('')}</div></div></details><div class="actions">${Object.entries(verdicts).map(([k,v])=>`<button data-verdict="${k}" class="${d?.verdict===k?'selected':''}">${t(...v)}</button>`).join('')}<button class="notes-toggle" data-note-toggle>${t('Add a note','补充判断')}</button></div><div class="notes ${d?.note?'':'hidden'}"><textarea aria-label="Editorial note" placeholder="${t('What did the screener miss?','筛选器漏看了什么？')}">${esc(d?.note||'')}</textarea><button data-save-note>${t('Save','保存')}</button></div></div></article>`;
}
function renderSources(){const reports=Object.fromEntries(data.source_reports.map(s=>[s.id,s]));const domains=new Set(data.events.flatMap(e=>e.articles.map(a=>a.domain))),langs=new Set(data.events.flatMap(e=>e.articles.map(a=>a.language.split('-')[0])).filter(l=>l!=='und'));
 $('#content').innerHTML=`<div class="section-heading"><h2>${t('A wider net, with visible gaps','扩大来源，也把缺口摆出来')}</h2></div><p class="muted">${t(`${domains.size} article domains observed · ${langs.size} declared source languages · Unknown-language index results retained.`, `实际出现${domains.size}个文章域名 · ${langs.size}种已标注来源语言 · 未识别语言的索引结果仍保留。`)}</p><div style="overflow:auto;margin-top:20px"><table class="source-table"><thead><tr><th>${t('Source','来源')}</th><th>${t('Region / language','地区／语言')}</th><th>${t('This run','本轮状态')}</th><th>${t('Read / retained','读到／保留')}</th></tr></thead><tbody>${data.sources.map(s=>{const r=reports[s.id];return `<tr><td><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a><div class="small muted">${esc(s.kind)}</div></td><td>${esc(s.region)}<br>${esc(s.language)}</td><td><span class="pill ${r?.status==='OK'?'':'warn'}">${s.enabled===false?t('Not enabled','未启用'):r?.status==='OK'?t('Read successfully','成功读取'):t('Unavailable','不可用')}</span><div class="small muted">${esc(r?.reason||s.note||'')}</div></td><td>${n(r?.entries_seen)} / ${n(r?.returned)}${r?.old_excluded||r?.invalid_excluded?`<div class="small muted">${t('Older / invalid','过期／无效')}: ${n(r.old_excluded)} / ${n(r.invalid_excluded)}</div>`:''}</td></tr>`}).join('')}</tbody></table></div><p class="footnote">${t('Expandable RSS/Atom registry plus a global index. Publisher feeds look back7 days; the global feed samples a rolling15-minute window. A registered source is not a guarantee of access or an independent confirmation.','可扩展的RSS／Atom来源表，加全球发现索引。媒体源回看7天，全球索引为滚动15分钟窗口。列入来源表不等于保证可访问，也不等于独立证实。')}</p>`;
}
function renderMethod(){$('#content').innerHTML=`<section class="method"><div class="eyebrow">${t('PROPOSED · FOR ROBIN’S REVIEW','待审阅 · 尚未定型')}</div><h2>${t('Find events before writing headlines.','先筛事件，再写标题。')}</h2><div class="method-grid"><div><strong>01 ${t('Discover','发现')}</strong>${t('Publisher feeds + open global discovery. Keep failed feeds visible.','媒体订阅与全球发现索引；保留失败记录。')}</div><div><strong>02 ${t('Screen','筛选')}</strong>${t('Group duplicate coverage. Estimate consequences, not noise.','合并重复报道，评估后果，不按声量加分。')}</div><div><strong>03 ${t('Review','审阅')}</strong>${t('Your selection becomes a research handoff, never an automatic post.','你的选择进入研究交接，不会自动发布。')}</div></div><p>${t('Inspired by News Minimalist’s public significance factors. These are our proposed weights, not its unpublished formula.','参考News Minimalist公开的评价维度；以下权重是iSun的初始假设，并非其未公开的原公式。')} <a href="https://www.newsminimalist.com/about" target="_blank" rel="noopener">${t('Read the original method','阅读原方法')} ↗</a></p>${Object.entries(factorNames).map(([k,v])=>`<div class="factor"><span>${t(...v)}</span><div class="bar"><i style="width:${data.rubric.weights[k]*100}%"></i></div><span>${data.rubric.weights[k]*100}%</span></div>`).join('')}<ul><li>${t('Significance =2.5 × the weighted0–4 factors. A missing factor makes the total unknown. No calibrated pass threshold yet.','重要性=五项0–4分加权后乘2.5。任何一项缺失，总分即未知。暂不设置未经校准的通过线。')}</li><li>${t('Credibility is an evidence question. Positivity is a separate label. Story potential predicts appeal, not observed engagement.','可信度由证据判断；正面性单列；故事潜力预测吸引力，不是假装实测的互动数据。')}</li><li>${t('Source volume does not increase significance. Same-company announcements, translations and syndicated copies are not independent proof.','来源数量不提高重要性。同一公司的公告、翻译和转载不算独立证据。')}</li><li>${t('A large event can require investigation before acceptance. A small event can still have a great human story.','大事件可能仍需核查，小事件也可能讲出动人的故事。')}</li><li>${t('Top ten plus five samples outside it give us both picks and misses to learn from. No model training is claimed yet.','审阅前十名，再抽查五条落选项，同时学习选择与遗漏。目前尚未训练专门模型。')}</li></ul><p class="muted">${t('The prototype is deliberately separate from the daily briefing and live Story Engine. No publication, account changes or audience expansion occurs here.','此原型独立于每日简报和线上Story Engine。在这里不会触发发布、账户变更或访问范围扩大。')}</p></section>`}
document.addEventListener('click',async ev=>{const b=ev.target.closest('button');if(!b)return;
 if(b.dataset.tab){tab=b.dataset.tab;query='';category='';region='';pageSize=30;render();return}
 if(b.id==='language'){lang=lang==='en'?'zh':'en';localStorage.setItem('radar-language',lang);render();return}
 if(b.id==='refresh'){await load();return}if(b.id==='more'){pageSize+=30;renderList();return}
 const el=b.closest('.card');if(!el)return;
 if(b.hasAttribute('data-note-toggle')){el.querySelector('.notes').classList.toggle('hidden');return}
 if(b.dataset.verdict||b.hasAttribute('data-save-note')){const e=data.events.find(x=>x.id===el.dataset.id),verdict=b.dataset.verdict||decision(e)?.verdict||'needs_evidence';b.disabled=true;
 try{const r=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':data.review_token},body:JSON.stringify({run_id:data.run_id,id:e.id,revision:e.revision,expected_version:data.reviews.version,verdict,note:el.querySelector('textarea').value})});const result=await r.json();if(!r.ok)throw Error(result.error);data.reviews=result;renderList();notify(t('Review saved. Nothing was published.','审阅已保存，没有发布任何内容。'))}catch(err){b.disabled=false;notify(err.message)}}
});load();
</script></body></html>
